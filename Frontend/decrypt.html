<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krypto - Select Media Cipher</title>

    <!-- Google Font: Orbitron & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #030712;
            background-image: url('https://res.cloudinary.com/ygllvtyg/image/upload/v1785172795/Screenshot_2026-07-27_224856_saundu.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #00e5ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-navbar {
            width: 100%;
            padding: 20px 40px;
            border-bottom: 2px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(10px);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00e5ff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
            text-decoration: none;
        }

        /* Page Content Area */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            gap: 40px;
        }

        .menu-title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            text-transform: uppercase;
        }

        .menu-title span {
            color: #00e5ff;
        }

        /* 3 Card Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 950px;
        }

        /* Clean Neon Hover Card (No Left-to-Right Animation) */
        .cipher-card {
            background: rgba(10, 15, 30, 0.8);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            text-decoration: none;
            color: #00e5ff;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
            min-height: 240px;
        }

        .cipher-card:hover {
            transform: translateY(-6px);
            border-color: #00ffff;
            background: rgba(12, 22, 45, 0.88);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.5), inset 0 0 12px rgba(0, 229, 255, 0.15);
        }

        .card-icon {
            width: 55px;
            height: 55px;
            stroke: #00e5ff;
            filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.6));
            transition: stroke 0.25s ease, filter 0.25s ease;
        }

        .cipher-card:hover .card-icon {
            stroke: #ffffff;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
        }

        .card-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.25s ease;
        }

        .cipher-card:hover .card-name {
            color: #ffffff;
        }

        .card-meta {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Card Button */
        .card-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: #030712;
            background: #00e5ff;
            padding: 8px 18px;
            border-radius: 4px;
            margin-top: 6px;
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        .cipher-card:hover .card-btn {
            background: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        /* Wide Back Button */
        .back-wrapper {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: center;
        }

        .btn-back {
            display: block;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            color: #00e5ff;
            background: rgba(10, 15, 30, 0.85);
            border: 2px solid #00e5ff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
        }

        .btn-back:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
            transform: translateY(-3px);
        }

        @media (max-width: 820px) {
            .cards-grid {
                grid-template-columns: 1fr;
                max-width: 420px;
            }

            .back-wrapper {
                max-width: 420px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Branding Navbar -->
    <header class="top-navbar">
        <a href="/" class="logo-text" style="text-decoration: none;">KRYPTO</a>
    </header>

    <!-- Main Container -->
    <main class="container">
        <h2 class="menu-title">SELECT <span>CIPHER MODULE</span></h2>

        <!-- 3 Media Selection Cards -->
        <div class="cards-grid">
            <!-- 1. Image Cipher -->
            <a href="/decryptimage.html" class="cipher-card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <div class="card-name">IMAGE CIPHER</div>
                <div class="card-meta">PNG FORMAT ONLY</div>
                <span class="card-btn">DECRYPT</span>
            </a>

            <!-- 2. Audio Cipher -->
            <a href="/decryptaudio.html" class="cipher-card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <div class="card-name">AUDIO CIPHER</div>
                <div class="card-meta">MP3 / WAV STREAM</div>
                <span class="card-btn">DECRYPT</span>
            </a>

            <!-- 3. Video Cipher -->
            <a href="/decryptvideo.html" class="cipher-card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
                <div class="card-name">VIDEO CIPHER</div>
                <div class="card-meta">MP4 (&lt; 20 SECONDS)</div>
                <span class="card-btn">DECRYPT</span>
            </a>
        </div>

        <!-- Bottom Back Button -->
        <div class="back-container">
            <a href="/" class="portal-link">&lt; BACK TO HOME</a>
        </div>
    </main>

</body>
</html>
