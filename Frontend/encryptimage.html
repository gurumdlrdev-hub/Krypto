<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krypto - Encrypt Image</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            background-image: url('https://res.cloudinary.com/ygllvtyg/image/upload/v1785172795/Screenshot_2026-07-27_224856_saundu.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #00e5ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .top-navbar {
            width: 100%;
            padding: 18px 36px;
            border-bottom: 2px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(10px);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00e5ff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
            text-decoration: none;
        }

        /* Layout Container */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .cipher-box {
            width: 100%;
            max-width: 520px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            padding: 36px 30px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .box-header {
            text-align: center;
        }

        .box-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
        }

        .box-subtitle {
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* Upload Form */
        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Pure CSS Native Drag & Drop Zone */
        .dropzone-container {
            position: relative;
            width: 100%;
            height: 180px;
            border: 2px dashed #00e5ff;
            border-radius: 8px;
            background: rgba(5, 10, 20, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            overflow: hidden;
        }

        /* Invisible Native File Input Layer covering entire box */
        .dropzone-container input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        /* Hover and Drag effects using CSS only */
        .dropzone-container:hover {
            border-color: #ffffff;
            background: rgba(0, 229, 255, 0.12);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.45);
        }

        .upload-icon {
            stroke: #00e5ff;
            filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.6));
            pointer-events: none;
        }

        .drop-label-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #e2e8f0;
            text-align: center;
            pointer-events: none;
        }

        .drop-label-text span {
            color: #00e5ff;
            text-decoration: underline;
        }

        .format-hint {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* Passphrase / Key Input */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #00e5ff;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            font-family: 'Inter', sans-serif;
            background: rgba(5, 10, 20, 0.9);
            border: 1px solid #00e5ff;
            border-radius: 6px;
            padding: 13px 15px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
        }

        .form-input::placeholder {
            color: #475569;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Submit Button */
        .btn-encrypt-submit {
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.1);
            border: 2px solid #00e5ff;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.25);
            transition: all 0.25s ease;
            margin-top: 6px;
        }

        .btn-encrypt-submit:hover {
            background: #00e5ff;
            color: #030712;
            border-color: #00ffff;
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.75);
            transform: translateY(-2px);
        }

        .btn-encrypt-submit:active {
            transform: translateY(0);
        }

        /* Back Link */
        .back-nav {
            text-align: center;
        }

        .back-nav a {
            font-family: 'Orbitron', sans-serif;
            color: #00e5ff;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 1.5px;
            opacity: 0.75;
            transition: opacity 0.2s ease, text-shadow 0.2s ease;
        }

        .back-nav a:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <header class="top-navbar">
        <a href="/" class="logo-text" style="text-decoration: none;">KRYPTO</a>
    </header>

    <main class="main-container">
        <div class="cipher-box">
            <div class="box-header">
                <h1 class="box-title">IMAGE CIPHER</h1>
                <div class="box-subtitle">AES-256-GCM ENCRYPTION</div>
            </div>

            
            <form action="/encrypt/image" method="POST" enctype="multipart/form-data" class="upload-form">
                
                <!-- Pure CSS Drag & Drop Box -->
                <div class="dropzone-container">
                    
                    <input type="file" name="encrypt_image" accept=".png" required>
                    
                    <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p class="drop-label-text">DRAG &amp; DROP PNG OR <span>BROWSE</span></p>
                    <span class="format-hint">SUPPORTED: PNG ONLY</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-encrypt-submit">START ENCRYPTION</button>
            </form>

            <div class="back-container">
                <a href="/encrypt" class="portal-link">&lt; BACK TO ENCRYPT MODULES</a>
            </div>
        </div>
    </main>

</body>
</html>
