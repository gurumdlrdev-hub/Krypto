<!DOCTYPE html>
<html lang="ta">
    <head>
        <title>Krypto - Image Encrypt</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Google Font: Orbitron -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Orbitron', sans-serif;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                background-color: #0d1117;
                background-image: url('https://res.cloudinary.com/ygllvtyg/image/upload/v1785172795/Screenshot_2026-07-27_224856_saundu.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                color: #00BFFF;
            }

            /* Top Branding Bar */
            .top-navbar {
                width: 100%;
                padding: 18px 32px;
                border-bottom: 2px solid #00BFFF;
                box-shadow: 0 0 20px rgba(0, 191, 255, 0.45);
                background: rgba(10, 15, 30, 0.7);
                backdrop-filter: blur(8px);
            }

            .logo-text {
                font-size: 22px;
                font-weight: 800;
                letter-spacing: 4px;
                text-transform: uppercase;
                color: #00BFFF;
                text-shadow: 0 0 12px rgba(0, 191, 255, 0.8), 0 0 24px rgba(0, 191, 255, 0.4);
                text-decoration: none;
            }

            /* Center Stage */
            .page-container {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 30px 20px;
            }

            .main {
                width: 100%;
                max-width: 520px;
                display: flex;
                flex-direction: column;
                gap: 22px;
            }

            /* Form Card */
            .upload-card {
                background: rgba(10, 15, 30, 0.8);
                backdrop-filter: blur(10px);
                border: 2px solid #00BFFF;
                border-radius: 8px;
                padding: 28px;
                box-shadow: 0 0 20px rgba(0, 191, 255, 0.25);
            }

            /* Image Drop Box */
            .drop-zone {
                position: relative;
                border: 2px dashed #00BFFF;
                border-radius: 6px;
                padding: 36px 15px;
                text-align: center;
                cursor: pointer;
                transition: all 0.25s ease;
                background: rgba(0, 191, 255, 0.03);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                overflow: hidden;
            }

            .drop-zone:hover {
                border-color: #00ffff;
                background: rgba(0, 191, 255, 0.08);
                box-shadow: 0 0 18px rgba(0, 191, 255, 0.35);
            }

            .drop-icon {
                width: 46px;
                height: 46px;
                stroke: #00BFFF;
                filter: drop-shadow(0 0 8px rgba(0, 191, 255, 0.6));
                pointer-events: none;
            }

            .drop-label {
                font-size: 13px;
                letter-spacing: 1px;
                pointer-events: none;
            }

            .drop-subtext {
                font-size: 10px;
                opacity: 0.65;
                letter-spacing: 1.5px;
                pointer-events: none;
            }

            /* Native Drag & Drop overlay */
            .drop-zone input[type="file"] {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                cursor: pointer;
                z-index: 10;
            }

            /* Action Button */
            .cipher-btn {
                width: 100%;
                font-family: 'Orbitron', sans-serif;
                background: rgba(10, 15, 30, 0.9);
                border: 2px solid #00BFFF;
                border-radius: 6px;
                padding: 14px;
                color: #00BFFF;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
                cursor: pointer;
                box-shadow: 0 0 14px rgba(0, 191, 255, 0.25);
                transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
                margin-top: 18px;
            }

            .cipher-btn:hover {
                transform: translateY(-2px);
                border-color: #00ffff;
                color: #00ffff;
                box-shadow: 0 0 22px rgba(0, 191, 255, 0.55), inset 0 0 10px rgba(0, 191, 255, 0.2);
            }

            .cipher-btn:active {
                transform: translateY(0);
            }

            /* Return to Portal Button Link */
            .back-container {
                display: flex;
                justify-content: center;
                width: 100%;
            }

            .portal-link {
                display: inline-block;
                width: 100%;
                text-align: center;
                padding: 12px 18px;
                background: rgba(10, 15, 30, 0.85);
                backdrop-filter: blur(8px);
                border: 1px solid #00BFFF;
                border-radius: 6px;
                color: #00BFFF;
                text-decoration: none;
                font-size: 12px;
                letter-spacing: 2px;
                box-shadow: 0 0 12px rgba(0, 191, 255, 0.25);
                transition: all 0.2s ease;
            }

            .portal-link:hover {
                color: #00ffff;
                border-color: #00ffff;
                box-shadow: 0 0 20px rgba(0, 191, 255, 0.5), inset 0 0 8px rgba(0, 191, 255, 0.2);
                transform: translateY(-2px);
            }
        </style>
    </head>
    <body>
        <header class="top-navbar">
            <a href="/" class="logo-text">KRYPTO</a>
        </header>

        <div class="page-container">
            <div class="main">
                <div class="upload-card">
                    <form action="/encrypt/image" method="POST" enctype="multipart/form-data">
                        <label for="image_input" class="drop-zone">
                            <!-- Image Icon -->
                            <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <span class="drop-label">CLICK OR DRAG IMAGE HERE</span>
                            <span class="drop-subtext">SUPPORTS: PNG ONLY</span>
                            <input type="file" id="image_input" name="encrypt_image" accept=".png" required>
                        </label>
                        <button type="submit" class="cipher-btn">Encrypt Image</button>
                    </form>
                </div>

                <!-- Highly Visible Return Button -->
                <div class="back-container">
                    <a href="/encrypt" class="portal-link">&lt; BACK TO ENCRYPT MODULES</a>
                </div>
            </div>
        </div>
    </body>
</html>
